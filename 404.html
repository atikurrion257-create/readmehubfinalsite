<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — ReadMeHub</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --page: #F3F5F8; --ink: #182230; --muted: #57616F;
      --accent: #2B57D4; --border: #DCE2E9;
    }
    @media (prefers-color-scheme: dark) {
      :root { --page: #141920; --ink: #E9EEF4; --muted: #A2ADBB; --accent: #8FAEFF; --border: #2A323D; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--page); color: var(--ink); padding: 24px;
    }
    main { max-width: 520px; text-align: left; }
    .eyebrow {
      font-size: 12px; font-weight: 650; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--muted); margin: 0 0 12px;
    }
    h1 { font-size: 2rem; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 16px; }
    p { color: var(--muted); line-height: 1.65; margin: 0 0 24px; }
    a.btn {
      display: inline-flex; align-items: center; min-height: 48px;
      padding: 12px 24px; border-radius: 12px; text-decoration: none;
      background: var(--accent); color: #fff; font-weight: 650; font-size: 15px;
    }
    a.btn:hover { text-decoration: none; filter: brightness(1.08); }
    a:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">404 · Not found</p>
    <h1>This page doesn't exist yet.</h1>
    <p>
      The link may be outdated, or the page hasn't been published. The homepage has the current
      decision guides, comparisons, and research.
    </p>
    <a class="btn" href="https://atikurrion257-create.github.io/readmehubfinalsite/">Back to the homepage</a>
  </main>
</body>
</html>
